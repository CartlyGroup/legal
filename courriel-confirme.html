<!DOCTYPE html>
<!--
  PAGE D'ATTERRISSAGE DES LIENS DE COURRIEL.

  À déposer dans le dépôt public CartlyGroup/legal, avec `logo-cartly.png` à côté. Elle est servie à
  https://cartlygroup.github.io/legal/courriel-confirme.html

  POURQUOI ELLE EXISTE. Les liens pointaient directement sur `cartly://`. Sur un téléphone c'est
  parfait — l'app s'ouvre et connecte. Sur un ORDINATEUR, le navigateur ne connaît pas ce schéma :
  il affiche une page d'erreur. Le compte est pourtant bel et bien confirmé (Supabase le fait côté
  serveur AVANT de rediriger), mais la personne voit un échec et recommence.

  LE PIÈGE, ET C'EST TOUT L'ENJEU DE CE FICHIER. Supabase place les jetons de session dans le
  FRAGMENT de l'URL (#access_token=…&refresh_token=…&type=signup). Le fragment n'est jamais envoyé
  au serveur : il ne vit que dans le navigateur. Cette page doit donc le réexpédier tel quel vers
  cartly://, sinon l'app s'ouvre sans jetons et l'entrée directe est perdue — exactement ce qu'on
  venait de gagner. C'est `extraireLienCourriel` (App.js) qui les relit à l'arrivée.

  On n'ouvre l'app AUTOMATIQUEMENT que sur mobile : déclencher cartly:// sur un ordinateur ne
  produirait qu'une boîte de dialogue d'erreur, juste après avoir annoncé que tout allait bien.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cartly</title>
<link rel="icon" href="logo-cartly.png">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; background: #F5EDE0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #2D1F0E;
  }
  .carte {
    width: 100%; max-width: 440px; background: #FFFFFF;
    border-radius: 20px; padding: 40px 30px;
    box-shadow: 0 12px 32px rgba(45, 31, 14, .08);
    text-align: center;
  }
  .logo { display: block; width: 76px; height: auto; margin: 0 auto 24px; }
  h1 { margin: 0 0 10px; font-size: 24px; font-weight: 800; line-height: 1.2; letter-spacing: -.3px; }
  p  { margin: 0; font-size: 15px; line-height: 1.55; color: #5B4A35; }
  .bouton {
    display: inline-block; margin: 26px 0 0;
    background: #E05252; color: #FFFFFF; text-decoration: none;
    font-size: 16px; font-weight: 700; padding: 15px 32px; border-radius: 13px;
  }
  .bouton:active { opacity: .85; }
  .note { margin: 20px 0 0; font-size: 13px; line-height: 1.5; color: #A68B6E; }
  .pied {
    margin: 28px 0 0; padding-top: 20px; border-top: 1px solid #F0E6D8;
    font-size: 12.5px; line-height: 1.6; color: #A68B6E;
  }
  .pied strong { display: block; color: #8A7259; font-weight: 700; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <main class="carte">
    <img class="logo" src="logo-cartly.png" alt="Cartly">
    <h1 id="titre">On vérifie ton lien…</h1>
    <p id="message"></p>

    <a class="bouton" id="ouvrir" href="#" hidden>Ouvrir Cartly</a>
    <p class="note" id="note" hidden></p>

    <p class="pied">
      <strong>Cartly</strong>
      Ton épicerie, au meilleur prix.
    </p>
  </main>

<script>
(function () {
  var titre   = document.getElementById('titre');
  var message = document.getElementById('message');
  var bouton  = document.getElementById('ouvrir');
  var note    = document.getElementById('note');

  // Le fragment porte les jetons. On le garde TEL QUEL : toute réécriture risquerait d'abîmer
  // un jeton, et l'app le relit avec URLSearchParams exactement dans cette forme.
  var fragment = window.location.hash || '';
  var params   = new URLSearchParams(fragment.replace(/^#/, ''));
  var type     = params.get('type');
  var aJetons  = !!(params.get('access_token') && params.get('refresh_token'));

  var lien = 'cartly://' + fragment;
  bouton.href = lien;

  // Un téléphone peut ouvrir cartly://. Un ordinateur non : le lui proposer n'afficherait qu'une
  // erreur système, juste après lui avoir dit que tout était correct.
  var surMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  function poser(t, m, noteTexte, avecBouton) {
    titre.textContent = t;
    message.textContent = m;
    if (noteTexte) { note.textContent = noteTexte; note.hidden = false; }
    if (avecBouton) bouton.hidden = false;
  }

  if (!aJetons) {
    // Page ouverte à la main, ou lien déjà consommé : certains antivirus de messagerie
    // pré-chargent les liens pour les analyser, ce qui brûle un lien à usage unique.
    poser(
      'Ce lien a déjà servi',
      'Ton compte est peut-être déjà actif : essaie de te connecter. Sinon, demande un nouveau courriel depuis l’application.'
    );
    return;
  }

  if (type === 'recovery') {
    if (surMobile) {
      poser('On ouvre Cartly', 'Tu pourras choisir ton nouveau mot de passe.',
            'Rien ne se passe ? Touche le bouton.', true);
      setTimeout(function () { window.location.href = lien; }, 700);
    } else {
      poser('Ton lien est valide',
            'Ouvre-le depuis ton téléphone pour choisir ton nouveau mot de passe.',
            'Tu as ouvert ce lien sur un ordinateur. Cartly vit sur ton téléphone.');
    }
    return;
  }

  if (surMobile) {
    poser('C’est confirmé', 'On ouvre Cartly…', 'Rien ne se passe ? Touche le bouton.', true);
    // Laisse le temps à la page de s'afficher : une redirection instantanée donne l'impression
    // que le lien n'a pas fonctionné.
    setTimeout(function () { window.location.href = lien; }, 700);
  } else {
    poser('Ton compte est prêt',
          'Retourne sur ton téléphone et ouvre Cartly. Tu peux te connecter.',
          'Tu as ouvert ce lien sur un ordinateur. Cartly vit sur ton téléphone.');
  }
})();
</script>
</body>
</html>
